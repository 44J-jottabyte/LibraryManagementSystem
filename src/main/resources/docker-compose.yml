version: '2.1'

services:
  oracle-xe:
    image: container-registry.oracle.com/database/express:latest
    container_name: oracle-xe
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
      - ORACLE_PWD=welcome123
      - ORACLE_SID=XE
      - ORACLE_CHARACTERSET=AL32UTF8
    volumes:
      - oracle-data:/opt/oracle/oradata
    networks:
      - hospital-network
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "1521" ]
      interval: 30s
      timeout: 10s
      retries: 5

  spring-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@oracle-xe:1521:XE
      - SPRING_DATASOURCE_USERNAME=C##Lms
      - SPRING_DATASOURCE_PASSWORD=welcome123
    depends_on:
      oracle-xe:
        condition: service_healthy
    networks:
      - hospital-network
volumes:
  oracle-data:
    driver: local

networks:
  hospital-network:
    external: true